name: astrbot_plugin_biocore
display_name: BioCore · 拟态生物情绪核心
desc: |
  面向 AstrBot 的本地拟态生物情绪核心：不声称真实生物机制，而是用可计算状态模拟生物情绪的功能结构——PAD 核心情感、稳态/内感受驱动、认知评价与情绪频谱、事件记忆与遗忘/召回、关系轨迹与修复；
  由解释层把状态转成简短的表达意图注入请求，不生成回复、不替换人设、不诊断。提供本地 Dashboard、可选 LLM 总结和隐私/安全开关，数据保存在 AstrBot 插件数据目录，更新不丢档。
version: 1.2.97
author: Johnhmzm
repo: https://github.com/Johnhmzm/astrbot_plugin_biocore
short_desc: 拟态生物情绪层：PAD/稳态/记忆/关系轨迹，向 LLM 注入表达意图；不生成回复。
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16,<5"
tags:
  - emotion
  - persona
  - memory
  - companion
category: emotion
social_link: https://github.com/Johnhmzm/astrbot_plugin_biocore