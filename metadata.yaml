name: astrbot_plugin_biocore
display_name: BioCore 生物情绪核心
desc: |
  面向 AstrBot 的本地生物情绪层：读取当前人设并维护数值档案，在对话中维护情感、压力、能量、信任、记忆事件和关系轨迹；
  由解释层把状态转成简短的表达意图注入请求，不生成回复、不替换人设、不诊断。提供本地 Dashboard、可选 LLM 总结和隐私/安全开关，数据保存在 AstrBot 插件数据目录，更新不丢档。
version: 1.2.96
author: Johnhmzm
repo: https://github.com/Johnhmzm/astrbot_plugin_biocore
short_desc: 本地生物情绪层：人设数值档案、记忆事件、关系轨迹与 Dashboard，可选 LLM 总结。
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16,<5"
tags:
  - emotion
  - persona
  - memory
  - companion
category: emotion
social_link: https://github.com/Johnhmzm/astrbot_plugin_biocore