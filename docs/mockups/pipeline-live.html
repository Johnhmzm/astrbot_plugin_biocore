<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>流水线 · 交互原型</title>
<style>
:root{--bg:#0a0c0f;--panel:#0f1318;--line:#1f262e;--fg:#e8e5de;--muted:#8b8579;--accent:#ff6b00;--faint:#57524a;--dot:#3a424c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Bahnschrift","Segoe UI",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:18px;margin:0 0 2px}
.sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.bus{background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:14px}
.bus b{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--faint);letter-spacing:.1em;display:block;font-weight:400}
.bus span{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.bus i{font-size:10.5px;color:var(--muted);font-style:normal;margin-left:4px}
.steps{position:relative}
.step{background:#111721;border:1px solid #262f3a;padding:11px 13px;margin-bottom:22px;position:relative;cursor:pointer;transition:.15s}
.step:hover{border-color:#3d4a58}
.step.sel{border-color:rgba(255,107,0,.7);box-shadow:0 0 0 1px rgba(255,107,0,.25)}
.step.off{opacity:.45;border-style:dashed}
.step::after{content:"";position:absolute;left:50%;bottom:-22px;width:1px;height:22px;background:#2a313a}
.step:last-child::after{display:none}
.srow{display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.step.off .dot{background:#39414b}
.no{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--faint);width:14px}
.name{flex:1;font-size:14px}
.tag{font-family:ui-monospace,Consolas,monospace;font-size:9px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line);padding:1px 4px}
.ms{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted)}
.st{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--faint);width:52px;text-align:right}
.st.ok{color:var(--accent)}
.snote{font-size:11px;color:var(--muted);margin:6px 0 0 32px}
.sw{width:34px;height:17px;position:relative;flex:0 0 auto}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#1b2129;border:1px solid var(--line)}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;background:#6b7480;transition:.15s}
.sw input:checked+i{border-color:rgba(255,107,0,.55);background:rgba(255,107,0,.1)}
.sw input:checked+i:after{left:19px;background:var(--accent)}
.slot{border:1px dashed #38414c;color:#4f5964;text-align:center;padding:14px;margin-bottom:22px;font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);padding:13px 15px;margin-bottom:14px}
.panel h2{font-size:12px;margin:0 0 10px;letter-spacing:.08em}
.detail{font-size:12px;color:var(--muted);line-height:1.9}
.detail b{color:var(--fg);font-weight:500}
.detail code{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#121923;border:1px solid #26303b;padding:8px 11px;font-size:12px;color:#d6d1c6;cursor:pointer}
.chip:hover{border-color:rgba(255,107,0,.5);color:var(--accent)}
.btn{border:1px solid rgba(255,107,0,.5);background:rgba(255,107,0,.1);color:var(--accent);padding:9px 14px;font-size:13px;cursor:pointer}
.btn.ghost{border-color:var(--line);background:#101620;color:var(--muted)}
.acts{display:flex;gap:10px;margin:4px 0 16px}
.running .step{animation:pulse .6s}
@keyframes pulse{50%{border-color:var(--accent);background:rgba(255,107,0,.06)}}
@media(max-width:520px){.snote{margin-left:0}.ms{display:none}}
</style></head><body><div class="wrap">
<h1>流水线</h1>
<div class="sub">点方块看它读什么写什么 · 开关即时生效（原型，数据为示例）</div>

<div class="bus">
  <div><b>V / 阈值</b><span>0.44<i>/0.55</i></span></div>
  <div><b>效价</b><span>+0.44</span></div>
  <div><b>压力</b><span>0.21</span></div>
  <div><b>寂寞</b><span>0.52</span></div>
  <div><b>精力</b><span>0.72</span></div>
  <div><b>自尊</b><span>0.51</span></div>
</div>

<div class="acts">
  <button class="btn" id="run">试运行一条</button>
  <button class="btn ghost" id="reset">全部开启</button>
</div>

<div class="steps" id="steps"></div>
<div class="slot">＋ 从下方添加环节</div>

<div class="panel" id="detail"><h2>选择方块查看详情</h2><div class="detail">点上方任意方块。</div></div>

<div class="panel"><h2>可添加</h2><div class="grid" id="lib"></div></div>

<script>
const S=[
 {n:"感知",tag:"L2",req:1,ms:12,note:"解析文本、附件"},
 {n:"取记忆",tag:"L1",ms:88,note:"召回 4 条 · 衰减更新"},
 {n:"情绪更新",tag:"L0",req:1,ms:120,note:"效价 0.42→0.44 · 压力 0.21→0.24"},
 {n:"决定",tag:"L4",ms:3,note:"回复（非主动）"},
 {n:"表达·语气",tag:"L3",ms:41,note:"焦虑 ×0.8 · 字少"},
 {n:"表达·意图",tag:"L3",ms:0,note:"已关闭",off:1},
 {n:"思考",tag:"LLM",req:1,ms:390,note:"18 字"},
 {n:"反馈·守卫",tag:"FB",ms:5,note:"接受 2 项 · 拒绝 1 项（trust 超限）"},
 {n:"呈现",tag:"L4",req:1,ms:1,note:"12 字 · 已分段"}
];
const LIB=[["心情层","L0"],["依恋动态","L0"],["归因","L0"],["社会疼痛","L0"],["连接邀请","L4"],["信任三层","L4"],["关系阶段","L4"],["挫折曲线","L4"],["自我生活","L3"],["遗忘衰减","L1"],["反刍","L1"],["可变强化","L4"]];
const box=document.getElementById("steps"),det=document.getElementById("detail"),lib=document.getElementById("lib");
let sel=2;
function render(){
  box.innerHTML=S.map((s,i)=>`
   <div class="step ${s.off?'off':''} ${sel===i?'sel':''}" data-i="${i}">
     <div class="srow">
       <span class="dot"></span><span class="no">${String(i+1).padStart(2,'0')}</span>
       <span class="name">${s.n}</span><span class="tag">${s.tag}</span>
       <span class="ms">${s.off?'—':s.ms+'ms'}</span>
       <span class="st ${s.off?'':'ok'}">${s.off?'SKIP':'OK'}</span>
       ${s.req?'<span class="tag">必需</span>':`<label class="sw"><input type="checkbox" data-t="${i}" ${s.off?'':'checked'}><i></i></label>`}
     </div>
     <div class="snote">${s.note}</div>
   </div>`).join("");
  box.querySelectorAll(".step").forEach(el=>el.onclick=e=>{if(e.target.closest(".sw"))return;sel=+el.dataset.i;render();detail();});
  box.querySelectorAll(".sw input").forEach(inp=>inp.onchange=e=>{e.stopPropagation();S[+inp.dataset.t].off=!inp.checked;render();detail();});
}
function detail(){
  const s=S[sel];if(!s)return;
  det.innerHTML=`<h2>环节详情</h2><div class="detail">
    <b>${s.n}</b> · ${s.tag} · ${s.off?'已关闭':'运行中'}<br>
    读取：<code>ctx.*</code> 与上游输出<br>
    写出：<code>${s.note}</code><br>
    上次：${s.off?'跳过':s.ms+'ms · ok'}<br>
    ${s.req?'<span style="color:#8b8579">必需环节，不可移除</span>':''}
  </div>`;
}
lib.innerHTML=LIB.map(([n,t])=>'<span class="chip">+ '+n+' <span class="tag">'+t+'</span></span>').join("");
lib.querySelectorAll(".chip").forEach((c,i)=>c.onclick=()=>{
  const [n,t]=LIB[i];
  S.splice(S.length-1,0,{n,t,ms:10+Math.round(Math.random()*90),note:"新加入 · 等待首次运行"});
  sel=S.length-2;render();detail();
});
document.getElementById("run").onclick=()=>{
  box.classList.add("running");let i=0;
  const tick=setInterval(()=>{if(i>=S.length){clearInterval(tick);box.classList.remove("running");return;}
    const el=box.children[i];if(el){el.style.borderColor="rgba(255,107,0,.9)";setTimeout(()=>el&&(el.style.borderColor=""),400);}i++;},170);
};
document.getElementById("reset").onclick=()=>{S.forEach(s=>{if(!s.req)s.off=0});render();detail();};
render();detail();
</script></div></body></html>
